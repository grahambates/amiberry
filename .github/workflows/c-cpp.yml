      - name: ZIP package for release
        if: github.ref_type == 'tag'
        run: zip -r amiberry-${{ github.ref_name }}-${{ matrix.release_name }}.zip amiberry_*.deb

      - name: Upload artifact for release
        if: always() && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: "amiberry-*.zip"

  build-alpine-multiarch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, arm/v7]
        include:
          - arch: amd64
            platform: linux/amd64
            name: x86_64
          - arch: arm64
            platform: linux/arm64
            name: aarch64
          - arch: arm/v7
            platform: linux/arm/v7
            name: armv7l

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in Alpine container
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v $PWD:/workspace \
            -w /workspace \
            alpine:latest \
            sh -c '
              set -e
              
              echo "=== Installing build tools ==="
              apk update
              apk add --no-cache \
                build-base \
                cmake \
                ninja \
                git \
                linux-headers \
                file \
                binutils \
                pkgconfig \
                autoconf \
                automake \
                libtool \
                wget
              
              echo "=== Building minimal static dependencies ==="
              
              # Build zlib statically
              cd /tmp
              wget https://zlib.net/zlib-1.3.1.tar.gz
              tar -xzf zlib-1.3.1.tar.gz
              cd zlib-1.3.1
              ./configure --prefix=/usr/local --static
              make -j$(nproc) install
              
              # Build libpng statically  
              cd /tmp
              wget https://download.sourceforge.net/libpng/libpng-1.6.43.tar.gz
              tar -xzf libpng-1.6.43.tar.gz
              cd libpng-1.6.43
              ./configure --prefix=/usr/local --enable-static --disable-shared
              make -j$(nproc) install
              
              # Build SDL2 statically
              cd /tmp
              wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.8/SDL2-2.30.8.tar.gz
              tar -xzf SDL2-2.30.8.tar.gz
              cd SDL2-2.30.8
              ./configure --prefix=/usr/local --enable-static --disable-shared \
                --disable-video-wayland --disable-video-x11 \
                --enable-video-dummy --disable-audio \
                --disable-joystick --disable-haptic
              make -j$(nproc) install
              
              echo "=== Installing minimal Alpine packages ==="
              apk add --no-cache alsa-lib-dev
              
              echo "=== Applying musl compatibility fixes ==="
              cd /workspace
              
              # Fix ucontext_t issue
              if [ -f src/jit/x86/exception_handler.cpp ]; then
                echo "Fixing ucontext_t in exception_handler.cpp"
                cp src/jit/x86/exception_handler.cpp src/jit/x86/exception_handler.cpp.bak
                sed "s/struct ucontext_t/ucontext_t/g" src/jit/x86/exception_handler.cpp.bak > src/jit/x86/exception_handler.cpp
              fi
              
              echo "=== Configuring with static libraries ==="
              export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
              export LDFLAGS="-L/usr/local/lib"
              export CPPFLAGS="-I/usr/local/include"
              
              cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="/usr/local" \
                -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++" \
                -DCMAKE_FIND_LIBRARY_SUFFIXES=".a" \
                -DBUILD_SHARED_LIBS=OFF \
                -DCMAKE_CXX_FLAGS="-D_GNU_SOURCE -Dfseeko64=fseeko -Dftello64=ftello -D_LARGEFILE64_SOURCE" \
                -DCMAKE_C_FLAGS="-D_GNU_SOURCE -Dfseeko64=fseeko -Dftello64=ftello -D_LARGEFILE64_SOURCE" \
                -DUSE_LIBSERIALPORT=OFF \
                -DUSE_LIBENET=OFF \
                -DUSE_PORTMIDI=OFF \
                -DUSE_LIBMPEG2=OFF \
                -DUSE_UAENET_PCAP=OFF \
                || { echo "CMake configuration failed"; exit 1; }
              
              echo "=== Building Amiberry ==="
              cmake --build build -j$(nproc) || { echo "Build failed"; exit 1; }
              
              echo "=== Post-build processing ==="
              strip build/amiberry
              file build/amiberry
              
              echo "=== Dependencies check ==="
              ldd build/amiberry || echo "No dynamic dependencies (fully static)"
              
              echo "=== Packaging ==="
              mkdir -p package/bin
              cp build/amiberry package/bin/
              
              # Copy data files if they exist
              if [ -d data ]; then cp -r data/ package/; fi
              if [ -d kickstarts ]; then cp -r kickstarts/ package/; fi
              if [ -d conf ]; then cp -r conf/ package/; fi
              if [ -d whdboot ]; then cp -r whdboot/ package/; fi
              
              tar -czf amiberry-portable-${{ matrix.name }}.tar.gz -C package .
              echo "=== Build completed successfully ==="
              
              # Show what we built
              echo "=== Binary info ==="
              ls -lh package/bin/amiberry
              file package/bin/amiberry
            '

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amiberry-alpine-${{ matrix.name }}
          path: amiberry-portable-${{ matrix.name }}.tar.gz

  create-release:
    needs:
      [
        build-macOS-x86_64,
        build-macOS-Apple-Silicon,
        build-fedora-x86_64,
        build-ubuntu-24-amd64,
        build-ubuntu-22-amd64,
        build-debian-amd64,
        build-debian-arm64,
        build-debian-armhf,
      ]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    steps:
      - uses: actions/checkout@v4

      - name: Create Changelog
        if: github.ref_type == 'tag'
        id: changelog
        uses: loopwerk/tag-changelog@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config_file: .github/tag-changelog-config.js

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          body: ${{ steps.changelog.outputs.changes }}
          artifacts: |
            artifacts/amiberry-*.zip
            artifacts/Amiberry-*.zip

  create-prerelease:
    needs:
      [
        build-macOS-x86_64,
        build-macOS-Apple-Silicon,
        build-fedora-x86_64,
        build-ubuntu-24-amd64,
        build-ubuntu-22-amd64,
        build-debian-amd64,
        build-debian-arm64,
        build-debian-armhf,
      ]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'preview-v')
    steps:
      - uses: actions/checkout@v4

      - name: Create Changelog
        if: github.ref_type == 'tag'
        id: changelog
        uses: loopwerk/tag-changelog@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config_file: .github/tag-changelog-config.js

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create PreRelease
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          body: ${{ steps.changelog.outputs.changes }}
          artifacts: |
            artifacts/amiberry-*.zip
            artifacts/Amiberry-*.zip
