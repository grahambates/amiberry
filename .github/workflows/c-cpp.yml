    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: bullseye
            image: midwan/amiberry-debian-armhf:bullseye
            artifact_name: amiberry-debian-bullseye-armhf
            release_name: debian-bullseye-armhf
          - name: bookworm
            image: midwan/amiberry-debian-armhf:bookworm
            artifact_name: amiberry-debian-bookworm-armhf
            release_name: debian-bookworm-armhf
    steps:
      - uses: actions/checkout@v4

      - name: Run the build process with Docker
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.image }}
          options: -v ${{ github.workspace }}:/build
          run: |
            cmake -DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-arm-linux-gnueabihf.cmake -B build -G Ninja -DCMAKE_INSTALL_PREFIX=/usr && cmake --build build -j4
            cpack -G DEB --config build/CPackConfig.cmake

      - name: Upload artifact
        if: always() && github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: "amiberry_*.deb"

      - name: ZIP package for release
        if: github.ref_type == 'tag'
        run: zip -r amiberry-${{ github.ref_name }}-${{ matrix.release_name }}.zip amiberry_*.deb

      - name: Upload artifact for release
        if: always() && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: "amiberry-*.zip"

  build-alpine-multiarch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, arm/v7]
        include:
          - arch: amd64
            platform: linux/amd64
            name: x86_64
          - arch: arm64
            platform: linux/arm64
            name: aarch64
          - arch: arm/v7
            platform: linux/arm/v7
            name: armv7l

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in Alpine container
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v $PWD:/workspace \
            -w /workspace \
            alpine:latest \
            sh -c '
              set -e
              
              echo "=== Installing build tools ==="
              apk update
              apk add --no-cache \
                build-base \
                cmake \
                ninja \
                git \
                linux-headers \
                file \
                binutils \
                patchelf
              
              echo "=== Installing libraries ==="
              apk add --no-cache \
                flac-dev \
                libpng-dev \
                sdl2-dev \
                sdl2_ttf-dev \
                sdl2_image-dev \
                alsa-lib-dev \
                mpg123-dev \
                zstd-dev
              
              echo "=== Applying musl compatibility fixes ==="
              cd /workspace
              
              if [ -f src/jit/x86/exception_handler.cpp ]; then
                cp src/jit/x86/exception_handler.cpp src/jit/x86/exception_handler.cpp.bak
                sed "s/struct ucontext_t/ucontext_t/g" src/jit/x86/exception_handler.cpp.bak > src/jit/x86/exception_handler.cpp
              fi
              
              echo "=== Configuring with RPATH ==="
              cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath,\$ORIGIN/../lib" \
                -DCMAKE_CXX_FLAGS="-D_GNU_SOURCE -Dfseeko64=fseeko -Dftello64=ftello" \
                -DCMAKE_C_FLAGS="-D_GNU_SOURCE -Dfseeko64=fseeko -Dftello64=ftello" \
                -DUSE_LIBSERIALPORT=OFF \
                -DUSE_LIBENET=OFF \
                -DUSE_PORTMIDI=OFF \
                -DUSE_LIBMPEG2=OFF \
                -DUSE_UAENET_PCAP=OFF
              
              cmake --build build -j$(nproc)
              
              echo "=== Creating package structure ==="
              mkdir -p package/bin package/lib
              
              # Copy the binary
              cp build/amiberry package/bin/
              
              echo "=== Copying shared library dependencies ==="
              # Get list of all dependencies except system libraries
              ldd build/amiberry | grep "=> /" | awk "{print \$3}" | while read lib; do
                libname=\$(basename "\$lib")
                libdir=\$(dirname "\$lib")
                
                # Skip system libraries that should not be bundled
                case "\$libdir" in
                  "/lib"|"/lib64")
                    echo "Skipping system library: \$lib"
                    ;;
                  *)
                    if [ -f "\$lib" ]; then
                      echo "Copying \$lib -> package/lib/\$libname"
                      cp "\$lib" package/lib/
                    fi
                    ;;
                esac
              done
              
              # Also copy transitive dependencies
              echo "=== Copying transitive dependencies ==="
              for lib in package/lib/*.so*; do
                if [ -f "\$lib" ]; then
                  ldd "\$lib" 2>/dev/null | grep "=> /" | awk "{print \$3}" | while read deplib; do
                    deplibname=\$(basename "\$deplib")
                    deplibdir=\$(dirname "\$deplib")
                    
                    case "\$deplibdir" in
                      "/lib"|"/lib64")
                        ;;
                      *)
                        if [ -f "\$deplib" ] && [ ! -f "package/lib/\$deplibname" ]; then
                          echo "Copying transitive dependency: \$deplib"
                          cp "\$deplib" package/lib/
                        fi
                        ;;
                    esac
                  done
                fi
              done
              
              echo "=== Setting up RPATH and creating wrapper ==="
              # Ensure RPATH is set correctly
              patchelf --set-rpath "\$ORIGIN/../lib" package/bin/amiberry
              
              # Create wrapper script
              echo "#!/bin/sh" > package/amiberry
              echo "DIR=\"\$(dirname \"\$(readlink -f \"\$0\")\")\"" >> package/amiberry
              echo "export LD_LIBRARY_PATH=\"\$DIR/lib:\$LD_LIBRARY_PATH\"" >> package/amiberry
              echo "exec \"\$DIR/bin/amiberry\" \"\$@\"" >> package/amiberry
              chmod +x package/amiberry
              
              # Copy data files if they exist
              if [ -d data ]; then cp -r data/ package/; fi
              if [ -d kickstarts ]; then cp -r kickstarts/ package/; fi
              if [ -d conf ]; then cp -r conf/ package/; fi
              if [ -d whdboot ]; then cp -r whdboot/ package/; fi
              
              echo "=== Package contents ==="
              echo "Bundled libraries:"
              ls -la package/lib/
              
              echo "Package structure:"
              find package -type f | head -20
              
              echo "RPATH verification:"
              patchelf --print-rpath package/bin/amiberry
              
              tar -czf amiberry-portable-${{ matrix.name }}.tar.gz -C package .
              echo "=== Build completed successfully ==="
            '

      - name: Test portable package
        run: |
          echo "=== Testing portable package ==="
          tar -xzf amiberry-portable-${{ matrix.arch }}.tar.gz -C /tmp/test
          cd /tmp/test

          echo "Checking if libraries are bundled:"
          ls -la lib/

          echo "Testing wrapper script:"
          ./amiberry --help || echo "Help command completed"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amiberry-alpine-${{ matrix.name }}
          path: amiberry-portable-${{ matrix.name }}.tar.gz

  create-release:
    needs:
      [
        build-macOS-x86_64,
        build-macOS-Apple-Silicon,
        build-fedora-x86_64,
        build-ubuntu-24-amd64,
        build-ubuntu-22-amd64,
        build-debian-amd64,
        build-debian-arm64,
        build-debian-armhf,
      ]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    steps:
      - uses: actions/checkout@v4

      - name: Create Changelog
        if: github.ref_type == 'tag'
        id: changelog
        uses: loopwerk/tag-changelog@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config_file: .github/tag-changelog-config.js

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          body: ${{ steps.changelog.outputs.changes }}
          artifacts: |
            artifacts/amiberry-*.zip
            artifacts/Amiberry-*.zip

  create-prerelease:
    needs:
      [
        build-macOS-x86_64,
        build-macOS-Apple-Silicon,
        build-fedora-x86_64,
        build-ubuntu-24-amd64,
        build-ubuntu-22-amd64,
        build-debian-amd64,
        build-debian-arm64,
        build-debian-armhf,
      ]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'preview-v')
    steps:
      - uses: actions/checkout@v4

      - name: Create Changelog
        if: github.ref_type == 'tag'
        id: changelog
        uses: loopwerk/tag-changelog@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config_file: .github/tag-changelog-config.js

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create PreRelease
        if: github.ref_type == 'tag'
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          body: ${{ steps.changelog.outputs.changes }}
          artifacts: |
            artifacts/amiberry-*.zip
            artifacts/Amiberry-*.zip
